name: update

# Copies the formula the latest tritium release attaches into Formula/, once it
# installs. Hourly, on demand, and when tritium's release workflow dispatches.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: fetch the latest release's formula
        id: fetch
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tritium.rb" https://github.com/we-be/tritium/releases/latest/download/tritium.rb
          v=$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' "$RUNNER_TEMP/tritium.rb" | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if cmp -s "$RUNNER_TEMP/tritium.rb" Formula/tritium.rb; then
            echo "up to date: $v"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
      # Ubuntu runners no longer ship Homebrew. This puts one on PATH and, run
      # inside a tap's repository, installs this checkout as that tap — resetting
      # the checkout as it does, which is why the formula is copied in after it.
      - uses: Homebrew/actions/setup-homebrew@main
        if: steps.fetch.outputs.changed == 'yes'
      - name: install it
        if: steps.fetch.outputs.changed == 'yes'
        run: |
          cp "$RUNNER_TEMP/tritium.rb" Formula/tritium.rb
          brew trust we-be/tritium 2>/dev/null || true   # Homebrew 6; older ones have no such command
          brew install we-be/tritium/tritium
          brew list --versions tritium | grep -q " ${{ steps.fetch.outputs.version }}$"
          brew test tritium
      # setup-homebrew rewires the checkout's remote, losing the branch's
      # upstream and the token checkout stored, so the push names both.
      - name: commit
        if: steps.fetch.outputs.changed == 'yes'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "tritium v${{ steps.fetch.outputs.version }}"
          git push "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:main
